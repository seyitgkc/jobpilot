<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}jobpilot{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #23211d; --muted: #7a766d;
  --line: #e4e1da; --accent: #305c48; --accent-ink: #ffffff;
  --warn: #a4552a; --bad: #9c3a3a; --good: #2f6b4f;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
nav {
  display: flex; gap: 1.25rem; align-items: baseline;
  padding: 0.8rem 1.5rem; background: var(--panel);
  border-bottom: 1px solid var(--line);
}
nav .brand { font-weight: 700; letter-spacing: 0.02em; margin-right: 0.5rem; }
nav a { color: var(--ink); text-decoration: none; }
nav a:hover { color: var(--accent); }
main { max-width: 68rem; margin: 1.5rem auto 4rem; padding: 0 1.5rem; }
h1 { font-size: 1.35rem; margin: 0.2rem 0 1rem; }
h2 { font-size: 1.05rem; margin: 1.6rem 0 0.5rem; }
a { color: var(--accent); }
table { width: 100%; border-collapse: collapse; background: var(--panel); }
th, td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1.2rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.6rem 0 1rem; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 0.15rem 0.7rem; font-size: 0.85rem; }
.chip b { color: var(--accent); }
.badge { display: inline-block; border-radius: 4px; padding: 0.05rem 0.45rem; font-size: 0.78rem; }
.badge.status { background: #e9efe9; color: var(--good); }
.badge.blocked { background: #f6e3d9; color: var(--warn); }
.badge.off { background: #eee; color: var(--muted); }
.badge.fail { background: #f3dcdc; color: var(--bad); }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
code, pre { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.82rem; }
pre { background: #f1efe9; padding: 0.6rem; border-radius: 6px; overflow-x: auto; }
form.inline { display: inline; }
button, select, input[type=text], textarea {
  font: inherit; padding: 0.3rem 0.6rem; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel); color: var(--ink);
}
button { cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--bad); }
textarea { width: 100%; min-height: 3.2rem; }
.pair-master { color: var(--muted); }
.pair-changed { background: #fbf6df; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1.2rem; }
ul.plain { list-style: none; padding-left: 0; margin: 0.3rem 0; }
ul.plain li { padding: 0.15rem 0; }
.field-row { border-top: 1px solid var(--line); padding: 0.6rem 0; }
.field-row:first-of-type { border-top: none; }
img.crop { display: block; max-width: 28rem; border: 1px solid var(--line); border-radius: 6px; margin: 0.4rem 0; }
object.pdf-frame { width: 100%; height: 36rem; border: 1px solid var(--line); border-radius: 6px; }
</style>
</head>
<body>
<nav>
  <span class="brand">jobpilot</span>
  <a href="/">Dashboard</a>
  <a href="/blockers">Blockers</a>
  <a href="/mail">Mail</a>
  <a href="/rules">Rules</a>
  <a href="/credentials">Login details</a>
  <a href="/settings">Settings</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
