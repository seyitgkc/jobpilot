[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Local job application assistant"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "markdownify>=0.13",
    "playwright>=1.49",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobpilot = "jobpilot.__main__:main"
jobpilot-browserd = "jobpilot.browserd.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
